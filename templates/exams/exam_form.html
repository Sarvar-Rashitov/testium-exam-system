{% extends 'base.html' %}
{% block title %}{{ title }} - IELTS Mock Exam{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">{{ title }}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Imtihon nomi *</label>
                            {{ form.title }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tavsif</label>
                            {{ form.description }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Davomiyligi (daqiqalarda) *</label>
                            {{ form.duration }}
                        </div>

                        <div class="mb-3 form-check">
                            {{ form.is_active }}
                            <label class="form-check-label" for="{{ form.is_active.id_for_label }}">
                                Faol
                            </label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% if exam %}{% url 'exam_detail' exam.pk %}{% else %}{% url 'exam_list' %}{% endif %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Bekor qilish
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Saqlash
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
