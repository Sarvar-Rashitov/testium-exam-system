{% extends 'base.html' %}
{% block title %}{{ title }} - Testium{% endblock %}

{% block extra_css %}
<style>
    .page-container {
        padding: 32px;
        max-width: 800px;
        margin: 0 auto;
    }

    .form-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        border: 1px solid #e5e7eb;
    }

    .form-title {
        font-size: 28px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 32px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }

    .form-control {
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        color: #1e293b;
        transition: all 0.3s ease;
        outline: none;
    }

    .form-control:focus {
        border-color: #4F46E5;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .form-check {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        background: #f8fafc;
        border-radius: 12px;
        border: 2px solid #e2e8f0;
    }

    .form-check input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
        accent-color: #4F46E5;
    }

    .form-check label {
        font-size: 15px;
        color: #1f2937;
        font-weight: 500;
        cursor: pointer;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 32px;
    }

    .btn {
        flex: 1;
        padding: 14px 24px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-primary {
        background: linear-gradient(135deg, #4F46E5, #6366F1);
        color: white;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
    }

    .btn-secondary {
        background: #f3f4f6;
        color: #6b7280;
    }

    .btn-secondary:hover {
        background: #e5e7eb;
    }

    @media (max-width: 768px) {
        .form-row {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="form-card">
        <h1 class="form-title">
            <i class="bi bi-person-badge"></i>
            {{ title }}
        </h1>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Ism *</label>
                    <input type="text" name="first_name" class="form-control" 
                           value="{{ teacher.first_name|default:'' }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Familiya *</label>
                    <input type="text" name="last_name" class="form-control" 
                           value="{{ teacher.last_name|default:'' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Fan</label>
                <input type="text" name="subject" class="form-control" 
                       value="{{ teacher.subject|default:'' }}" placeholder="Masalan: Ingliz tili">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Telefon</label>
                    <input type="text" name="phone" class="form-control" 
                           value="{{ teacher.phone|default:'' }}" placeholder="+998901234567">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" 
                           value="{{ teacher.email|default:'' }}" placeholder="email@example.com">
                </div>
            </div>

            {% if teacher %}
            <div class="form-group">
                <div class="form-check">
                    <input type="checkbox" name="is_active" id="is_active" 
                           {% if teacher.is_active %}checked{% endif %}>
                    <label for="is_active">Faol</label>
                </div>
            </div>
            {% endif %}

            <div class="form-actions">
                <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i>
                    Bekor qilish
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i>
                    Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
