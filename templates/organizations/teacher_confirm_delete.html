{% extends 'base.html' %}
{% block title %}O'qituvchini o'chirish - Testium{% endblock %}

{% block extra_css %}
<style>
    .page-container {
        padding: 32px;
        max-width: 600px;
        margin: 0 auto;
    }

    .delete-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        border: 1px solid #e5e7eb;
        text-align: center;
    }

    .delete-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        background: #fef2f2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: #dc2626;
    }

    .delete-title {
        font-size: 24px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 12px;
    }

    .delete-text {
        font-size: 16px;
        color: #6b7280;
        margin-bottom: 32px;
    }

    .teacher-info {
        background: #f9fafb;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 32px;
    }

    .teacher-name {
        font-size: 20px;
        font-weight: 600;
        color: #1f2937;
    }

    .form-actions {
        display: flex;
        gap: 12px;
    }

    .btn {
        flex: 1;
        padding: 14px 24px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-danger {
        background: #dc2626;
        color: white;
    }

    .btn-danger:hover {
        background: #b91c1c;
    }

    .btn-secondary {
        background: #f3f4f6;
        color: #6b7280;
    }

    .btn-secondary:hover {
        background: #e5e7eb;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="delete-card">
        <div class="delete-icon">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        
        <h1 class="delete-title">O'qituvchini o'chirish</h1>
        <p class="delete-text">Haqiqatan ham bu o'qituvchini o'chirmoqchimisiz?</p>

        <div class="teacher-info">
            <div class="teacher-name">{{ teacher.full_name }}</div>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i>
                    Bekor qilish
                </a>
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i>
                    O'chirish
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
