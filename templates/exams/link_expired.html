<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link yaroqsiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .expired-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .expired-card {
        background: white;
        border-radius: 24px;
        padding: 48px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
    }

    .expired-icon {
        width: 100px;
        height: 100px;
        margin: 0 auto 24px;
        background: #fee2e2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        color: #dc2626;
    }

    .expired-title {
        font-size: 32px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 16px;
    }

    .expired-message {
        font-size: 16px;
        color: #6b7280;
        margin-bottom: 32px;
    }

    .reasons-box {
        background: #fef3c7;
        border: 2px solid #fbbf24;
        border-radius: 16px;
        padding: 24px;
        text-align: left;
    }

    .reasons-title {
        font-size: 16px;
        font-weight: 600;
        color: #92400e;
        margin-bottom: 16px;
    }

    .reasons-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .reasons-list li {
        font-size: 15px;
        color: #1f2937;
        padding: 8px 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .reasons-list li i {
        color: #f59e0b;
        font-size: 16px;
    }

    .contact-message {
        font-size: 15px;
        color: #6b7280;
        margin-top: 32px;
    }

    @media (max-width: 768px) {
        .expired-card {
            padding: 32px 24px;
        }

        .expired-title {
            font-size: 24px;
        }

        .expired-icon {
            width: 80px;
            height: 80px;
            font-size: 40px;
        }
    }
</style>
</head>
<body>
<div class="expired-container">
    <div class="expired-card">
        <div class="expired-icon">
            <i class="bi bi-x-circle-fill"></i>
        </div>
        
        <h1 class="expired-title">Link yaroqsiz</h1>
        <p class="expired-message">Kechirasiz, bu imtihon linki endi ishlamaydi.</p>

        <div class="reasons-box">
            <h6 class="reasons-title">Mumkin bo'lgan sabablar:</h6>
            <ul class="reasons-list">
                <li>
                    <i class="bi bi-clock"></i>
                    <span>Link muddati tugagan</span>
                </li>
                <li>
                    <i class="bi bi-people"></i>
                    <span>Maksimal foydalanish soniga yetilgan</span>
                </li>
                <li>
                    <i class="bi bi-slash-circle"></i>
                    <span>Link o'chirilgan yoki nofaol qilingan</span>
                </li>
            </ul>
        </div>
        
        <p class="contact-message">
            <i class="bi bi-info-circle"></i>
            Iltimos, imtihon tashkilotchisi bilan bog'laning.
        </p>
    </div>
</div>
</body>
</html>
