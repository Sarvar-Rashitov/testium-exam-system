{% extends 'base.html' %}
{% block title %}Savolni o'chirish{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> O'chirish tasdiqi</h4>
                </div>
                <div class="card-body">
                    <p class="lead">Ushbu savolni o'chirishga ishonchingiz komilmi?</p>
                    <div class="alert alert-warning">
                        <strong>{{ question.question_text|truncatewords:20 }}</strong>
                        <br>
                        <small>Bu amal qaytarilmaydi.</small>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'exam_detail' question.exam.pk %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Bekor qilish
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Ha, o'chirish
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
